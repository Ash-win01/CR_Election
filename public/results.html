<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CR Election: Results</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#667085; --accent:#3b5bdb; --line:#e3e6ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b1f2a; --text:#e8ebf3; --muted:#9aa3b5; --accent:#748ffc; --line:#2b3140; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; } h2 { font-size:1.1rem; margin:0 0 12px; }
  p, .muted { color:var(--muted); font-size:.9rem; }
  .row { display:grid; grid-template-columns:110px 1fr 36px; gap:10px; align-items:center; margin-bottom:8px; }
  .bar { height:14px; background:var(--line); border-radius:7px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  .num { text-align:right; font-weight:600; }
  .voters { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:6px; font-size:.9rem; max-height:360px; overflow-y:auto; }
  .voters div { padding:6px 10px; border:1px solid var(--line); border-radius:8px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Live Results: CR Election</h1>
    <p id="meta">Loading…</p>
  </div>
  <div class="card"><h2>Votes per candidate</h2><div id="tallies"></div></div>
  <div class="card"><h2>Who has voted (<span id="count">0</span>)</h2>
    <p>Listed by roll number. This shows who voted, not whom they voted for.</p>
    <div class="voters" id="voters"></div>
  </div>
  <p style="text-align:center"><a href="/">Back to voting</a></p>
</main>
<script>
async function load() {
  const d = await (await fetch('/api/results')).json();
  const max = Math.max(1, ...d.tallies.map((t) => t.votes));
  const t = document.getElementById('tallies'); t.innerHTML = '';
  d.tallies.forEach((c) => {
    const row = document.createElement('div'); row.className = 'row';
    const n = document.createElement('span'); n.textContent = c.name;
    const bar = document.createElement('div'); bar.className = 'bar';
    const i = document.createElement('i'); i.style.width = (c.votes / max) * 100 + '%'; bar.append(i);
    const v = document.createElement('span'); v.className = 'num'; v.textContent = c.votes;
    row.append(n, bar, v); t.append(row);
  });
  const vs = document.getElementById('voters'); vs.innerHTML = '';
  d.voters.forEach((x) => {
    const div = document.createElement('div'); div.textContent = `${x.roll_no}, ${x.name || ''}`; vs.append(div);
  });
  document.getElementById('count').textContent = d.voters.length;
  const label = { open: 'Voting is open', ended: 'Voting has ended', not_started: 'Voting has not started' }[d.state];
  document.getElementById('meta').textContent =
    `${label} · Last updated ${new Date(d.updatedAt).toLocaleTimeString()}`;
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
